<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-label="Choosing a homeserver" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="680" height="280" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563a8"/></marker></defs><text x="24" y="36" font-size="20" font-weight="700" fill="#2563a8" text-anchor="start">Choosing a homeserver</text><rect x="20" y="56" width="200" height="172" rx="14" fill="#f0f2f4" stroke="#7b8794" stroke-width="1.5"/><text x="120" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Use a public server</text><text x="120" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">e.g. matrix.org</text><line x1="36" y1="118" x2="204" y2="118" stroke="#7b8794" stroke-width="1" opacity="0.5"/><circle cx="40" cy="142" r="3" fill="#7b8794"/><text x="50" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">free, start right away</text><circle cx="40" cy="172" r="3" fill="#7b8794"/><text x="50" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">someone else runs it</text><circle cx="40" cy="202" r="3" fill="#7b8794"/><text x="50" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">no say in settings</text><rect x="240" y="56" width="200" height="172" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="340" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Outsource operations</text><text x="340" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">e.g. etke.cc</text><line x1="256" y1="118" x2="424" y2="118" stroke="#2563a8" stroke-width="1" opacity="0.5"/><circle cx="260" cy="142" r="3" fill="#2563a8"/><text x="270" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">from €5/mo + server</text><circle cx="260" cy="172" r="3" fill="#2563a8"/><text x="270" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">updates, security done</text><circle cx="260" cy="202" r="3" fill="#2563a8"/><text x="270" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">own domain, any bots</text><rect x="460" y="56" width="200" height="172" rx="14" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.5"/><text x="560" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Run it all yourself</text><text x="560" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">e.g. Synapse</text><line x1="476" y1="118" x2="644" y2="118" stroke="#1a7f4b" stroke-width="1" opacity="0.5"/><circle cx="480" cy="142" r="3" fill="#1a7f4b"/><text x="490" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">pay only for the server</text><circle cx="480" cy="172" r="3" fill="#1a7f4b"/><text x="490" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">any setting, any bot</text><circle cx="480" cy="202" r="3" fill="#1a7f4b"/><text x="490" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">all maintenance is yours</text><line x1="120" y1="258" x2="560" y2="258" stroke="#1f2933" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="110" y="263" font-size="13" font-weight="700" fill="#1f2933" text-anchor="end">ease</text><text x="570" y="263" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">freedom</text></svg>
