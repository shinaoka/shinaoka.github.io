<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-label="ホームサーバーの選び方" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="680" height="280" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563a8"/></marker></defs><text x="24" y="36" font-size="20" font-weight="700" fill="#2563a8" text-anchor="start">ホームサーバーの選び方</text><rect x="20" y="56" width="200" height="172" rx="14" fill="#f0f2f4" stroke="#7b8794" stroke-width="1.5"/><text x="120" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">公開サーバーを使う</text><text x="120" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">matrix.org など</text><line x1="36" y1="118" x2="204" y2="118" stroke="#7b8794" stroke-width="1" opacity="0.5"/><circle cx="40" cy="142" r="3" fill="#7b8794"/><text x="50" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">無料ですぐ始められる</text><circle cx="40" cy="172" r="3" fill="#7b8794"/><text x="50" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">運用はおまかせ</text><circle cx="40" cy="202" r="3" fill="#7b8794"/><text x="50" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">設定は選べない</text><rect x="240" y="56" width="200" height="172" rx="14" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="340" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">借りたサーバーで運用委託</text><text x="340" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">etke.cc など</text><line x1="256" y1="118" x2="424" y2="118" stroke="#2563a8" stroke-width="1" opacity="0.5"/><circle cx="260" cy="142" r="3" fill="#2563a8"/><text x="270" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">月5ユーロ〜＋サーバー代</text><circle cx="260" cy="172" r="3" fill="#2563a8"/><text x="270" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">更新・セキュリティを委託</text><circle cx="260" cy="202" r="3" fill="#2563a8"/><text x="270" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">独自ドメイン・Botも自由</text><rect x="460" y="56" width="200" height="172" rx="14" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.5"/><text x="560" y="84" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">完全に自前で運用</text><text x="560" y="104" font-size="12" font-weight="400" fill="#52606d" text-anchor="middle">Synapse など</text><line x1="476" y1="118" x2="644" y2="118" stroke="#1a7f4b" stroke-width="1" opacity="0.5"/><circle cx="480" cy="142" r="3" fill="#1a7f4b"/><text x="490" y="147" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">費用はサーバー代のみ</text><circle cx="480" cy="172" r="3" fill="#1a7f4b"/><text x="490" y="177" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">設定もBotも何でもできる</text><circle cx="480" cy="202" r="3" fill="#1a7f4b"/><text x="490" y="207" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">保守もすべて自分で</text><line x1="120" y1="258" x2="560" y2="258" stroke="#1f2933" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="110" y="263" font-size="13" font-weight="700" fill="#1f2933" text-anchor="end">手軽さ</text><text x="570" y="263" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">自由度</text></svg>
