<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img" aria-label="スペース：ルームを束ねるフォルダ" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="680" height="322" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563a8"/></marker></defs><text x="24" y="36" font-size="20" font-weight="700" fill="#2563a8" text-anchor="start">スペース：ルームを束ねるフォルダ</text><rect x="20" y="56" width="640" height="190" rx="16" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="40" y="84" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">スペース：物性理論研究室</text><rect x="40" y="100" width="170" height="30" rx="7" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.2" /><text x="52" y="120" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"># 全体連絡</text><rect x="40" y="144" width="170" height="30" rx="7" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.2" /><text x="52" y="164" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"># セミナー</text><rect x="40" y="188" width="170" height="30" rx="7" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.2" /><text x="52" y="208" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"># 計算機</text><rect x="240" y="100" width="400" height="126" rx="12" fill="#fff" stroke="#2563a8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="258" y="126" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">サブスペース：共同研究プロジェクトA</text><rect x="258" y="142" width="170" height="30" rx="7" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.2" /><text x="270" y="162" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"># 打ち合わせ</text><rect x="258" y="184" width="170" height="30" rx="7" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="270" y="204" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"># 論文執筆</text><text x="442" y="204" font-size="12" font-weight="400" fill="#52606d" text-anchor="start">← 別サーバーのルームでもよい</text><text x="340" y="278" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">● 1つのルームを複数のスペースに入れられる</text><text x="340" y="302" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">● スペースに入っても、中のルームには必要なものだけ参加すればよい</text></svg>
