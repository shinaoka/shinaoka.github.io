<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="① 自分の端末の認証（必須）" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="680" height="400" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563a8"/></marker></defs><text x="24" y="36" font-size="20" font-weight="700" fill="#1a7f4b">① 自分の端末の認証（必須）</text><rect x="20" y="56" width="640" height="170" rx="16" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="80" font-size="13" fill="#52606d">あなたのアカウント（@you:example.org）</text><rect x="44" y="100" width="190" height="96" rx="12" fill="#e6f4ec" stroke="#1a7f4b" stroke-width="1.5"/><path d="M78 134.0 L90.0 139.0 L90.0 150.0 Q90.0 159.0 78 164.0 Q66.0 159.0 66.0 150.0 L66.0 139.0 Z" fill="#1a7f4b"/><path d="M73.0 149.0 L77.0 153.0 L84.0 144.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="144.0" font-size="17" font-weight="700" fill="#1f2933">Mac</text><text x="104" y="165.0" font-size="13" fill="#52606d">認証済み</text><rect x="446" y="100" width="190" height="96" rx="12" fill="#f0f2f4" stroke="#7b8794" stroke-width="1.5"/><path d="M480 134.0 L492.0 139.0 L492.0 150.0 Q492.0 159.0 480 164.0 Q468.0 159.0 468.0 150.0 L468.0 139.0 Z" fill="#7b8794"/><text x="480" y="154.0" font-size="14.0" font-weight="700" fill="#fff" text-anchor="middle">?</text><text x="506" y="144.0" font-size="17" font-weight="700" fill="#1f2933">iPhone</text><text x="506" y="165.0" font-size="13" fill="#52606d">新しい端末・未認証</text><line x1="242" y1="148" x2="438" y2="148" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/><text x="340" y="138" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Macで承認する</text><text x="340" y="170" font-size="12" fill="#52606d" text-anchor="middle">またはリカバリーキーを入力</text><rect x="215" y="276" width="250" height="68" rx="12" fill="#e8f0fa" stroke="#2563a8" stroke-width="1.5"/><text x="340" y="304" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">ホームサーバー</text><text x="340" y="326" font-size="13" fill="#52606d" text-anchor="middle">鍵のバックアップ（暗号化済み）</text><path d="M139 196 L139 310 L209 310" fill="none" stroke="#2563a8" stroke-width="2" marker-end="url(#ahb)"/><text x="147" y="262" font-size="12" fill="#2563a8">鍵を預ける</text><path d="M471 310 L541 310 L541 202" fill="none" stroke="#2563a8" stroke-width="2" marker-end="url(#ahb)"/><text x="533" y="262" font-size="12" fill="#2563a8" text-anchor="end">認証後に鍵を受け取れる</text><text x="340" y="380" font-size="13" fill="#1f2933" text-anchor="middle">認証するまで、新しい端末の過去のメッセージは「Unable to decrypt」のまま</text></svg>
